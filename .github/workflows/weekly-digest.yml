name: Weekly digest

on:
  schedule:
    # 00:17 UTC every Friday = 11:17 AEDT (summer) / 10:17 AEST (winter) in Melbourne,
    # comfortably before the 4 pm popup even if GitHub queues the job.
    - cron: "17 0 * * 5"
  push:
    # editing the search terms, journals or page re-runs and re-publishes
    branches: [main]
    paths: ["config.yaml", "scripts/**", "docs/index.html"]
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "Days to search back (default 8)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: weekly-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Search PubMed and build digest
        env:
          NCBI_API_KEY: ${{ secrets.NCBI_API_KEY }}
          NCBI_EMAIL: ${{ secrets.NCBI_EMAIL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
        run: python scripts/fetch_digest.py

      - name: Commit digest
        run: |
          git config user.name  "digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Digest $(date -u +%Y-%m-%d)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deploy
        uses: actions/deploy-pages@v4
